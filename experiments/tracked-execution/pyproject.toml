[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tracked-execution"
version = "0.1.0"
description = "Content-addressed caching and incremental reconciliation for PyVista pipelines"
requires-python = ">=3.11"
dependencies = [
    "pyvista>=0.44",
    "numpy>=1.24",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tracked_execution*", "tracked_core*", "tracked_data*"]
