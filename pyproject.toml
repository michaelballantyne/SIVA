[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vislang"
version = "0.1.0"
description = "Declarative scientific visualization via conversation"
requires-python = ">=3.9"
dependencies = [
    "vtk>=9.0",
    "mcp[cli]",
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["vislang*"]

[project.optional-dependencies]
dev = [
    "pytest",
]
