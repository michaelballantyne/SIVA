# uv_build (not setuptools) specifically so that editable installs register
# the package via a plain .pth path entry that Pylance/pyright can follow
# statically. Setuptools >= 64 editables install a runtime import-hook finder
# instead, which language servers can't see -- that's what forced the
# python.analysis.extraPaths workaround in editor setups (see README).
[build-system]
requires = ["uv_build>=0.8.17,<0.12"]
build-backend = "uv_build"

# SIVA uses a flat layout (siva/ at the repo root), not uv_build's default
# src/ layout.
[tool.uv.build-backend]
module-root = ""

[project]
name = "siva"
version = "0.1.0"
description = "Declarative scientific visualization via conversation"
# 3.11 floor: siva/spec_api.py imports typing.Unpack (3.11+), and the runtime
# already uses 3.10+ union syntax (`str | None`).
requires-python = ">=3.11"
dependencies = [
    "vtk>=9.0",
    "mcp[cli]",
    "numpy",
    "matplotlib",
    "watchdog>=3.0",
    # The sandbox boundary. Builtin-shadowing precedence and the restricted
    # module surface were verified against 0.0.18; keep a floor so an older
    # Monty can't silently weaken the sandbox semantics.
    "pydantic-monty>=0.0.18",
]

[project.optional-dependencies]
trame = [
    "trame>=3",
    "trame-vtk>=2.11",
    "trame-client",
]

# Dev-only tooling (PEP 735). uv installs this group by default with
# `uv sync`; pip users can get it via `pip install --group dev` (pip >= 25.1)
# or plain `pip install pytest`.
[dependency-groups]
dev = [
    "pytest",
]
