[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "siva"
version = "0.1.0"
description = "Declarative scientific visualization via conversation"
# 3.11 floor: siva/spec_api.py imports typing.Unpack (3.11+), and the runtime
# already uses 3.10+ union syntax (`str | None`).
requires-python = ">=3.11"
dependencies = [
    "vtk>=9.0",
    "mcp[cli]",
    "numpy",
    "matplotlib",
    "watchdog>=3.0",
    # The sandbox boundary. Builtin-shadowing precedence and the restricted
    # module surface were verified against 0.0.18; keep a floor so an older
    # Monty can't silently weaken the sandbox semantics.
    "pydantic-monty>=0.0.18",
]

[tool.setuptools.packages.find]
include = ["siva*"]

[project.optional-dependencies]
trame = [
    "trame>=3",
    "trame-vtk>=2.11",
    "trame-client",
]

# Dev-only tooling (PEP 735). uv installs this group by default with
# `uv sync`; pip users can get it via `pip install --group dev` (pip >= 25.1)
# or plain `pip install pytest`.
[dependency-groups]
dev = [
    "pytest",
]
