# Squid egress allowlist for the SIVA container.
#
# The SIVA workload runs on an internal (no-egress) Docker network; this proxy
# is its ONLY path to the internet, and it permits HTTPS only to Anthropic's
# domains. Everything else — and any attempt to bypass the proxy — fails
# closed. Edit `allowed` (and set ANTHROPIC_BASE_URL in the compose env) to use
# an alternate API endpoint.
#
# HTTPS is filtered by the CONNECT hostname (matched in cleartext before TLS),
# so no CA / TLS interception is needed and traffic stays end-to-end encrypted.

http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT

# Allowed destinations (leading dot = the domain and all subdomains).
acl allowed dstdomain .anthropic.com .claude.ai .claude.com

http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed
http_access allow allowed
http_access deny all

cache deny all
pid_filename none
# access.log (default /var/log/squid/access.log) is your egress audit trail:
#   docker compose logs proxy   /   docker exec <proxy> cat /var/log/squid/access.log
